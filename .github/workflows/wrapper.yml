# Ejecutar una vez a mano: genera gradlew + gradle-wrapper.jar oficiales y los sube en un commit.
name: Generar Gradle wrapper
on: workflow_dispatch
permissions: { contents: write }
jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m "Add Gradle wrapper" || echo "Sin cambios"
          git push
