name: APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: { contents: write }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.11.1" }
      - name: Firma
        env: { KS_B64: "${{ secrets.PARDELA_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pardela.jks"
            echo "PARDELA_KEYSTORE=$RUNNER_TEMP/pardela.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secreto PARDELA_KEYSTORE_B64: APK firmada con clave temporal (no se podrá actualizar encima)."
          fi
      - name: Pruebas
        run: if [ -x ./gradlew ]; then ./gradlew --no-daemon testDebugUnitTest; else gradle --no-daemon testDebugUnitTest; fi
      - name: Informe de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: informe-pruebas, path: app/build/reports/tests/, retention-days: 14 }
      - name: Compilar
        env:
          PARDELA_KEYSTORE_PASS: "${{ secrets.PARDELA_KEYSTORE_PASS }}"
          # Opcional: mensaje personal en la pantalla de bienvenida.
          PARDELA_DEDICATORIA: "${{ secrets.PARDELA_DEDICATORIA }}"
        run: if [ -x ./gradlew ]; then ./gradlew --no-daemon assembleRelease; else gradle --no-daemon assembleRelease; fi
      - run: cp app/build/outputs/apk/release/app-release.apk pardela.apk
      - uses: actions/upload-artifact@v7
        with: { name: pardela-apk, path: pardela.apk }
      # Traduce los informes de fallo (los nombres van ofuscados en la APK).
      - uses: actions/upload-artifact@v7
        with: { name: mapping, path: app/build/outputs/mapping/release/mapping.txt, retention-days: 90 }
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v') && env.PARDELA_KEYSTORE != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" pardela.apk --title "Pardela $GITHUB_REF_NAME" --generate-notes
