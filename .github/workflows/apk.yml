name: APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: { contents: write }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Firma
        env: { KS_B64: "${{ secrets.PARDELA_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pardela.jks"
            echo "PARDELA_KEYSTORE=$RUNNER_TEMP/pardela.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secreto PARDELA_KEYSTORE_B64: APK firmada con clave temporal (no se podrá actualizar encima)."
          fi
      - name: Compilar
        env: { PARDELA_KEYSTORE_PASS: "${{ secrets.PARDELA_KEYSTORE_PASS }}" }
        run: if [ -x ./gradlew ]; then ./gradlew --no-daemon assembleRelease; else gradle --no-daemon assembleRelease; fi
      - run: cp app/build/outputs/apk/release/app-release.apk pardela.apk
      - uses: actions/upload-artifact@v4
        with: { name: pardela-apk, path: pardela.apk }
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v') && env.PARDELA_KEYSTORE != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" pardela.apk --title "Pardela $GITHUB_REF_NAME" --generate-notes
